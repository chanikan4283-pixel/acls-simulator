<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="mg.css"><style>
body{background:#000}
#k{top:70px}#h{top:115px;font-size:110px}#s{top:250px;font-size:34px}
.lab{position:absolute;top:850px;width:360px;text-align:center}
.lab b{display:block;font:700 40px 'Inter Display';letter-spacing:-.02em}
.lab small{display:block;margin-top:8px;font:500 21px Inter;color:#9fb7bb}
</style></head><body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="k" class="abs center kick">Coming next</div>
<div id="h" class="abs center big grad">Every patient.</div>
<div id="s" class="abs center sub">New 3D models and animations for every kind of scenario.</div>
<div class="lab" id="l0" style="left:42px"><b>Pediatrics</b><small>Weight-based doses · PALS</small></div>
<div class="lab" id="l1" style="left:534px"><b>Trauma</b><small>Hemorrhage · tension PTX</small></div>
<div class="lab" id="l2" style="left:1026px"><b>Pregnancy</b><small>Uterine displacement · resuscitative delivery</small></div>
<div class="lab" id="l3" style="left:1518px"><b>Toxicology</b><small>Opioids · antidotes · infusions</small></div>
<script src="three.min.js"></script><script src="common.js"></script><script>
const R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:false});R.setSize(1920,1080,false);R.setClearColor(0x000000);
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(30,1920/1080,.1,100);cam.position.set(0,1.5,9);cam.lookAt(0,1.0,0);
S.fog=new THREE.Fog(0x000000,10,22);
const holo=(col,op=.22)=>new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});
const lineM=col=>new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false});
function part(geo,col,parent,x,y,z,sx=1,sy=1,sz=1){const g=new THREE.Group();const m=new THREE.Mesh(geo,holo(col));const l=new THREE.LineSegments(new THREE.WireframeGeometry(geo),lineM(col));l.material.opacity=.18;g.add(m,l);g.position.set(x,y,z);g.scale.set(sx,sy,sz);parent.add(g);return g;}
function human(col,{scale=1,belly=false}={}){const g=new THREE.Group();const sp=new THREE.SphereGeometry(1,22,16),cy=new THREE.CylinderGeometry(1,1,1,18,1);
 part(sp,col,g,0,1.62,0,.13,.16,.14);// head
 part(cy,col,g,0,1.43,0,.05,.08,.05);// neck
 part(sp,col,g,0,1.15,0,.24,.33,.15);// chest
 part(sp,col,g,0,.86,0,.2,.2,.13);// pelvis
 if(belly)part(sp,col,g,0,.98,.12,.2,.22,.2);
 for(const s of[-1,1]){part(cy,col,g,s*.3,1.08,0,.05,.5,.05).rotation.z=s*.12;part(cy,col,g,s*.36,.62,.03,.042,.42,.042).rotation.z=s*.05;part(cy,col,g,s*.11,.5,0,.075,.62,.075);part(cy,col,g,s*.11,.04,0,.06,.4,.06);}
 g.scale.setScalar(scale);return g;}
const COLS=[0x5fffe0,0xff6b6b,0xffb3e6,0x8fb8ff];
const figs=[],pads=[],extras=[];const xs=[-3.3,-1.1,1.1,3.3];
// pediatric: child + small adult outline for scale? just child on platform
figs.push(human(COLS[0],{scale:.62}));
figs.push(human(COLS[1]));
figs.push(human(COLS[2],{belly:true}));
figs.push(human(COLS[3]));
figs.forEach((f,i)=>{f.position.x=xs[i];S.add(f);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.62,64),holo(COLS[i],.6));ring.rotation.x=-Math.PI/2;ring.position.set(xs[i],0,0);S.add(ring);
 const disc=new THREE.Mesh(new THREE.CircleGeometry(.55,64),holo(COLS[i],.08));disc.rotation.x=-Math.PI/2;disc.position.set(xs[i],.001,0);S.add(disc);pads.push(ring);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,2.4,48,1,true),holo(COLS[i],.05));beam.position.set(xs[i],1.2,0);S.add(beam);extras.push(beam);});
// trauma: pulsing injury points
const inj=[];for(const p of [[.12,1.2,.15],[-.1,.55,.08],[.32,.75,.05]]){const m=new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),new THREE.MeshBasicMaterial({color:0xff2b2b,transparent:true,blending:THREE.AdditiveBlending}));m.position.set(...p);figs[1].add(m);inj.push(m);}
// pregnancy: fetal glow
const fetus=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),new THREE.MeshBasicMaterial({color:0xffe1f3,transparent:true,blending:THREE.AdditiveBlending}));fetus.position.set(0,.98,.16);figs[2].add(fetus);
// toxicology: orbiting molecules
const mol=new THREE.Group();figs[3].add(mol);const atoms=[];for(let i=0;i<14;i++){const a=new THREE.Mesh(new THREE.SphereGeometry(.035+.02*(i%3),10,8),new THREE.MeshBasicMaterial({color:i%2?0x8fb8ff:0xbfffe9,transparent:true,blending:THREE.AdditiveBlending}));mol.add(a);atoms.push(a);}
// pediatric: heart glow
const ph=new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),new THREE.MeshBasicMaterial({color:0x5fffe0,transparent:true,blending:THREE.AdditiveBlending}));ph.position.set(.05,1.2,.12);figs[0].add(ph);
// scan plane
const scans=xs.map((x,i)=>{const m=new THREE.Mesh(new THREE.RingGeometry(.2,.48,48),holo(COLS[i],.5));m.rotation.x=-Math.PI/2;m.position.x=x;S.add(m);return m;});
// floor grid
const grid=new THREE.GridHelper(30,60,0x0f3a3a,0x0a2424);grid.material.transparent=true;grid.material.opacity=.5;S.add(grid);
// particles
const pg=new THREE.BufferGeometry();const N=500,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*16;pos[i*3+1]=Math.random()*5;pos[i*3+2]=(Math.random()-.5)*8-2;}pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x7fffe0,size:.025,transparent:true,opacity:.6,blending:THREE.AdditiveBlending}));S.add(pts);
window.render=t=>{
 const a=eout(seg(t,0,.9));show($('k'),a);show($('h'),a,{y:(1-a)*30,blur:(1-a)*14});const b=eout(seg(t,.5,1.4));show($('s'),b,{y:(1-b)*20});
 figs.forEach((f,i)=>{const p=ease(seg(t,.6+i*.35,1.8+i*.35));f.rotation.y=t*.6+i;f.position.y=(1-p)*-2.5;f.visible=p>0;f.traverse(o=>{if(o.material&&o.material.userData.base===undefined)o.material.userData.base=o.material.opacity;if(o.material)o.material.opacity=o.material.userData.base*p;});
  scans[i].position.y=((t*.7+i*.3)%1)*1.9*(i?1:.62);scans[i].material.opacity=.4*p;pads[i].material.opacity=.6*p;extras[i].material.opacity=.05*p;
  const l=$('l'+i);const q=eout(seg(t,1.2+i*.35,2.0+i*.35));show(l,q,{y:(1-q)*20});});
 inj.forEach((m,i)=>m.scale.setScalar(1+.6*Math.abs(Math.sin(t*4+i))));
 fetus.scale.setScalar(1+.25*Math.sin(t*6));ph.scale.setScalar(1+.5*Math.max(0,Math.sin(t*9)));
 atoms.forEach((m,i)=>{const r=.45+.12*(i%3),th=t*(1+i*.07)+i*2.1;m.position.set(Math.cos(th)*r,.4+((i*.37+t*.12)%1)*1.5,Math.sin(th)*r);});
 pts.rotation.y=t*.03;cam.position.x=Math.sin(t*.25)*.8;cam.position.y=1.5+Math.sin(t*.3)*.1;cam.lookAt(0,1.0,0);
 R.render(S,cam);
 document.body.style.opacity=1-ease(seg(t,7.6,8.4));
};
render(0);
</script></body></html>
