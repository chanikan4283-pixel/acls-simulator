<!doctype html><html lang="en"><meta charset="utf-8"><title>ACLS sim · ECG review atlas</title><style>body{margin:20px;background:#10272d;color:#d8ece3;font:14px system-ui}h1{font-size:24px}section{margin:10px 0;break-inside:avoid}h2{font-size:14px;margin:8px}canvas{display:block;width:100%;height:245px}p{font-size:12px}nav a{color:#9cdeb8;margin:15px}</style><h1>ECG morphology review · synthetic teaching strips</h1><p>6-second strips · displayed grid scale, not physical screen millimeters. PEA is a clinical diagnosis, not a separate waveform. Expert approval pending.</p><nav><a href="?page=1">Strips 1–8</a><a href="?page=2">Strips 9–16</a></nav><main></main><script type="module">import {Trace} from './ecg.js';import {RHYTHMS} from './clinical.js';const page=+(new URLSearchParams(location.search).get('page')||1);for(const r of RHYTHMS.slice((page-1)*8,page*8)){const s=document.createElement('section');s.innerHTML=`<h2>${r.name}</h2><canvas aria-label="${r.name}"></canvas>`;document.querySelector('main').append(s);const trace=new Trace(s.querySelector('canvas'),{paper:true,seconds:6});const draw=()=>{trace.draw(0,r.id,r.hr,{staticStrip:true});requestAnimationFrame(draw)};draw();}</script></html>
